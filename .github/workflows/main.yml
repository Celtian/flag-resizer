name: 🚀 Build & Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  publish:
    name: 📦 Validate & Publish
    runs-on: ubuntu-latest

    steps:
      - name: 🗜️ Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🔎 Verify tag targets master
        run: test "$GITHUB_SHA" = "$(git rev-parse origin/master)"

      - name: 🔎 Verify package version
        run: test "v$(node --print "require('./package.json').version")" = "$GITHUB_REF_NAME"

      - name: 🗜️ Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      - name: 🗜️ Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: 🛠️ Install dependencies
        uses: ./.github/actions/cached-deps

      - name: ✅ Validate package
        run: bun run check

      - name: 🚀 Publish npm
        if: contains(github.ref, 'beta') == false
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 🚀 Publish npm beta
        if: contains(github.ref, 'beta') == true
        run: npm publish --ignore-scripts --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_AUTH_TOKEN }}

      - name: 📦 Prepare GitHub Packages manifest
        if: contains(github.ref, 'beta') == false
        run: bun run script:package-github

      - name: 🗜️ Setup GitHub Packages
        if: contains(github.ref, 'beta') == false
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://npm.pkg.github.com
          scope: '@celtian'

      - name: 🚀 Publish GitHub Packages
        if: contains(github.ref, 'beta') == false
        run: npm publish --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
